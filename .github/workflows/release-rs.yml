name: Release crate

on:
  push:
    tags:
      - "rs/v*"

jobs:
  test:
    uses: ./.github/workflows/test-rs.yml

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # Every target is built natively, so one failing runner says nothing about
      # the other four. Let them finish and report.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # `--features cli` is required, not decorative: the `[[bin]]` target carries
      # `required-features = ["cli"]`, so dropping it builds the library alone and
      # produces no binary — without failing.
      - name: Build the release binary
        working-directory: rs
        run: cargo build --release --locked -p interior-point --features cli --target ${{ matrix.target }}
      # The `LICENSE` files come from the repository root. `rs/core/`'s two are
      # symlinks, and a Windows checkout writes the link target as the file's
      # contents rather than following it.
      - name: Archive it
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME#rs/v}"
          NAME="interior-point-$VERSION-${{ matrix.target }}"
          mkdir "$NAME"
          cp "rs/target/${{ matrix.target }}/release/interior-point" "$NAME/"
          cp rs/core/README.md "$NAME/"
          cp LICENSE LICENSE_EDLv1.txt "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
      - name: Archive it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "$env:GITHUB_REF_NAME" -replace '^rs/v', ''
          $Name = "interior-point-$Version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $Name | Out-Null
          Copy-Item "rs/target/${{ matrix.target }}/release/interior-point.exe" $Name
          Copy-Item rs/core/README.md $Name
          Copy-Item LICENSE, LICENSE_EDLv1.txt $Name
          Compress-Archive -Path $Name -DestinationPath "$Name.zip"
          "ASSET=$Name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: interior-point-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish-crate:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: release-crates
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # `cargo metadata` rather than a grep of `rs/Cargo.toml`, so what is compared
      # is the resolved value of `version.workspace = true` — the one that ships.
      - name: Check the tag against the crate version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#rs/v}"
          PKG_VERSION="$(cargo metadata --no-deps --format-version 1 --manifest-path rs/Cargo.toml \
            | jq -r '.packages[] | select(.name == "interior-point") | .version')"
          echo "tag $TAG_VERSION / Cargo.toml $PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          case "$PKG_VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      # Ahead of the publish, not after it: a missing section must stop the run while
      # stopping is still free. crates.io refuses a re-publish of the same version
      # forever. The notes themselves are read again in the final job.
      - name: Fail early if the changelog has no section for this version
        run: node scripts/changelog-section.mjs rs/CHANGELOG.md "${{ steps.version.outputs.version }}" > /dev/null
      - name: Show what would be published
        working-directory: rs
        run: cargo publish -p interior-point --locked --dry-run
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        working-directory: rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p interior-point --locked
      - uses: actions/upload-artifact@v7
        with:
          name: interior-point-crate
          path: rs/target/package/interior-point-${{ steps.version.outputs.version }}.crate
          if-no-files-found: error

  release:
    name: Create the GitHub Release
    needs: [build-binaries, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: interior-point-*
          merge-multiple: true
      # The glob names the six subjects and cannot match the file being written,
      # so the order of expansion and redirection does not matter here.
      - name: Write the checksums
        working-directory: assets
        run: sha256sum interior-point-* > SHA256SUMS
      # crates.io has no provenance of its own. This is what stands in for the
      # sigstore attestation the npm side gets from `npm publish --provenance`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: assets/interior-point-*
      - name: Read the release notes out of the changelog
        run: node scripts/changelog-section.mjs rs/CHANGELOG.md "${{ needs.publish-crate.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            assets/interior-point-*
            assets/SHA256SUMS
          prerelease: ${{ needs.publish-crate.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
