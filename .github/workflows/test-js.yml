name: Test TypeScript

on:
  workflow_call:

jobs:
  test-js:
    name: Test TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck:js
      - run: pnpm test:scripts
      - run: pnpm test:js
      - run: pnpm build:js
      # `npm pack`, not `pnpm pack`: this is the tarball the release workflow publishes,
      # and the two tools do not write the same manifest.
      - name: Smoke-test the packed CLI via npx
        run: |
          cd js && npm pack --pack-destination "$RUNNER_TEMP" && cd ..
          mkdir "$RUNNER_TEMP/cli-smoke" && cd "$RUNNER_TEMP/cli-smoke" && npm init -y
          npm install --no-audit --no-fund "$RUNNER_TEMP"/interior-point-*.tgz
          test "$(npx --no-install interior-point -i 'POLYGON ((0 0, 10 0, 10 10, 0 10, 0 0))')" = '{"type":"Point","coordinates":[5,5]}'
          test "$(echo '{"type":"Polygon","coordinates":[[[0,0],[10,0],[10,10],[0,10],[0,0]]]}' | npx --no-install interior-point -f wkt)" = 'POINT (5 5)'
          ! npx --no-install interior-point -i 'NOTAGEOM' 2>/dev/null
      - name: Run the TypeScript examples in the documentation
        run: node scripts/docs-examples.mjs --only=ts
      - name: Check JTS anchor integrity
        run: node scripts/jts-sync.mjs anchors
      - name: Check for out-of-repo citations
        run: node scripts/jts-citations.mjs
