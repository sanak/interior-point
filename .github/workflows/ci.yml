name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-running an existing run is not a way to retry the Pages deployment: every attempt uploads
  # another artifact named `github-pages`, and `deploy-pages` refuses once more than one exists.
  # A fresh run is the only retry, and this is how to get one without an empty commit.
  workflow_dispatch:

jobs:
  test-js:
    uses: ./.github/workflows/test-js.yml

  test-rs:
    uses: ./.github/workflows/test-rs.yml

  test-wasm:
    uses: ./.github/workflows/test-wasm.yml

  docs:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: [test-js, test-rs, test-wasm]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rs
            examples/benchmark/geo-wasm
      # Same pin as test-wasm.yml — this build has to match what that job already verified,
      # not pick up whatever wasm-pack happens to be newest on release day.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:js
      - run: pnpm docs:build
      - run: pnpm examples:wasm
      - run: pnpm examples:build
      # examples/benchmark's own base is /interior-point/examples/benchmark/, so this is the one
      # path inside docs/.vitepress/dist that makes the built app resolve there once the whole
      # tree is uploaded as the Pages artifact below.
      - run: mkdir -p docs/.vitepress/dist/examples && cp -r examples/benchmark/dist docs/.vitepress/dist/examples/benchmark
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v5
        id: deployment
