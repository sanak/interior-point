name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-js:
    name: Test TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck:js
      - run: pnpm test:scripts
      - run: pnpm test:js
      - run: pnpm build:js
      - name: Smoke-test the packed CLI via npx
        run: |
          cd js && pnpm pack --pack-destination "$RUNNER_TEMP" && cd ..
          mkdir "$RUNNER_TEMP/cli-smoke" && cd "$RUNNER_TEMP/cli-smoke" && npm init -y
          npm install --no-audit --no-fund "$RUNNER_TEMP"/interior-point-*.tgz
          test "$(npx --no-install interior-point -i 'POLYGON ((0 0, 10 0, 10 10, 0 10, 0 0))')" = '{"type":"Point","coordinates":[5,5]}'
          test "$(echo '{"type":"Polygon","coordinates":[[[0,0],[10,0],[10,10],[0,10],[0,0]]]}' | npx --no-install interior-point -f wkt)" = 'POINT (5 5)'
          ! npx --no-install interior-point -i 'NOTAGEOM' 2>/dev/null
      - name: Check JTS anchor integrity
        run: node scripts/jts-sync.mjs anchors
      - name: Check for out-of-repo citations
        run: node scripts/jts-citations.mjs

  test-rs:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - run: cd rs && cargo test --workspace --all-features
      - run: cd rs && cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cd rs && cargo fmt --all --check
      - run: cd rs && cargo build --workspace --all-features
      - name: Smoke-test the CLI binary
        run: |
          cd rs
          test "$(./target/debug/interior-point -i 'POLYGON ((0 0, 10 0, 10 10, 0 10, 0 0))')" = '{"type":"Point","coordinates":[5,5]}'
          test "$(echo '{"type":"Polygon","coordinates":[[[0,0],[10,0],[10,10],[0,10],[0,0]]]}' | ./target/debug/interior-point -f wkt)" = 'POINT (5 5)'
          ! ./target/debug/interior-point -i 'NOTAGEOM' 2>/dev/null

  docs:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: [test-js, test-rs]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:js
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v5
        id: deployment
