[workspace]
members = ["core", "wasm"]
resolver = "2"

[workspace.package]
version = "1.0.0-rc.1"
# Edition 2024 is what sets this floor; declaring it makes cargo say so on an
# older toolchain instead of failing somewhere in the parse.
rust-version = "1.85"
license = "MIT"
authors = ["Ko Nagase"]
repository = "https://github.com/sanak/interior-point"
homepage = "https://sanak.github.io/interior-point/"

[workspace.dependencies]
geo-types = "0.7"
