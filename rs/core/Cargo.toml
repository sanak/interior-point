[package]
name = "interior-point"
version.workspace = true
edition = "2024"
license.workspace = true
description = "JTS InteriorPoint algorithm ported to Rust"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["geometry", "interior-point", "representative-point", "polygon", "jts"]
categories = ["algorithms", "science::geo"]
include = ["src/**/*", "Cargo.toml", "LICENSE", "LICENSE_EDLv1.txt", "README.md"]

[lib]
crate-type = ["rlib"]

[features]
cli = [
  "dep:wkt",
  "dep:geojson",
  "dep:clap",
  "dep:ryu",
  "dep:serde",
  "dep:serde_json",
  "dep:serde_json_lenient",
]

[dependencies]
geo-types.workspace = true
wkt = { version = "0.11", optional = true }
geojson = { version = "0.24", optional = true }
# For `Value::deserialize`, which the strict-JSON parse in `cli::io` needs: the
# `Deserialize` trait has to be in scope, and `serde_json_lenient` re-exports
# neither it nor the `serde` crate.
serde = { version = "1", optional = true }
# `float_roundtrip` is not optional on either of these: without it the parser is
# allowed to land one ULP away from the nearest double, so a coordinate read back
# out would not be the one written in. `serde_json` is declared only to carry
# that feature — `geojson` reads geometry through it, and cargo unifies the two.
# `ryu` supplies the shortest round-tripping digits, breaking a tie the way
# ECMAScript does; `cli::io` records why the standard library cannot.
ryu = { version = "1", optional = true }
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }
serde_json_lenient = { version = "0.2", optional = true, features = [
  "preserve_order",
  "float_roundtrip",
] }
clap = { version = "4", optional = true, default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "derive",
] }

[dev-dependencies]
wkt = "0.11"
quick-xml = "0.37"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "interior-point"
path = "src/bin/interior_point.rs"
required-features = ["cli"]

[[test]]
name = "interior_point_test"
path = "tests/algorithm/interior_point_test.rs"

[[test]]
name = "interior_point_cli_test"
path = "tests/cli/interior_point_cli_test.rs"
required-features = ["cli"]

[[bench]]
name = "interior_point_area_perf_test"
harness = false
