<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360"
     font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img"
     aria-label="Two panels. On a convex polygon the centroid lies inside and is returned as it is. On a concave polygon the centroid lands in the notch, and an arrow leads from it to the interior point the algorithm computes instead.">

  <!-- Left: a convex polygon, where a centroid is inside by definition -->
  <path d="M 60 55 L 225 40 L 250 175 L 140 250 L 35 165 Z"
        fill="#dfe3e8" stroke="#3a4048" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Right: the C of centroid-vs-interior-point.svg, with its notch from 378 to 530 in x and 105 to 185 in y -->
  <path d="M 300 40 L 530 40 L 530 105 L 378 105 L 378 185 L 530 185 L 530 250 L 300 250 Z"
        fill="#dfe3e8" stroke="#3a4048" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Centroid of the convex polygon: (144.6955, 134.4244). The blue ring around it is what the
       call returns, so the two symbols coincide. -->
  <g transform="translate(144.6955 134.4244)">
    <circle r="24" fill="none" stroke="#0b5fbf" stroke-width="3.5"/>
    <circle r="16" fill="#ffffff" stroke="#23272e" stroke-width="3" stroke-dasharray="8 4.566"/>
    <path d="M -7 -7 L 7 7 M 7 -7 L -7 7" stroke="#23272e" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- Centroid of the C: (401.8777, 145), which lies in the notch -->
  <g transform="translate(401.8777 145)">
    <circle r="16" fill="#ffffff" stroke="#23272e" stroke-width="3" stroke-dasharray="8 4.566"/>
    <path d="M -7 -7 L 7 7 M 7 -7 L -7 7" stroke="#23272e" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- The fallback. The only section of the scan line at y = 145 runs from 300 to 378, so the
       algorithm's point is its midpoint; the arrow curves clear of both markers. -->
  <path d="M 394 161 Q 369 199 342 168" fill="none" stroke="#0b5fbf" stroke-width="3"/>
  <path d="M 0 0 L -12 5.5 L -12 -5.5 Z" fill="#0b5fbf" transform="translate(342 168) rotate(-131.1)"/>
  <g transform="translate(339 145)">
    <circle r="15" fill="#ffffff"/>
    <circle r="11" fill="#0b5fbf"/>
  </g>

  <!-- the case above each figure, then what the call returns for it -->
  <g font-size="20" fill="#4a5058" text-anchor="middle">
    <text x="142" y="290">centroid is inside</text>
    <text x="415" y="290">centroid is outside</text>
  </g>
  <g font-size="21" font-weight="600" fill="#0b5fbf" text-anchor="middle">
    <text x="142" y="326">returned as is</text>
    <text x="415" y="326">falls back</text>
  </g>
</svg>
